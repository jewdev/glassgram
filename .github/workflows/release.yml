name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the release notes

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Zip dist
        run: cd dist && zip -r ../glassgram.zip .

      # Shown inside the extension's "Update available" and "What's new" cards.
      - name: Write release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: glassgram.zip
          body_path: notes.md
