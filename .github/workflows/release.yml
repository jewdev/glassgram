name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for what it needs. Only publish can write, and it never runs npm, so a dependency's
# install script can't publish a release.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the release notes
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Zip dist
        run: cd dist && zip -r ../glassgram.zip .

      # Shown inside the extension's "Update available" and "What's new" cards.
      - name: Write release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            glassgram.zip
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for scripts/sign.mjs and the public key. No npm in this job.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release

      # One-click updates install only a ZIP signed with this key.
      - name: Sign ZIP
        run: node scripts/sign.mjs glassgram.zip
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            glassgram.zip
            glassgram.zip.sig
          body_path: notes.md
