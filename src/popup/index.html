<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <title>Glassgram</title>
    <link rel="stylesheet" href="../shared/glass.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="field" aria-hidden="true">
      <span class="field__pool field__pool--a"></span>
      <span class="field__pool field__pool--b"></span>
      <span class="field__pool field__pool--c"></span>
    </div>

    <header class="head">
      <img class="brand__mark" src="/icons/icon.svg" width="36" height="36" alt="" aria-hidden="true" />
      <div class="head__text">
        <div class="head__name">Glassgram</div>
        <div id="status" class="status"><span class="status__dot" aria-hidden="true"></span><span id="status-text">Checking tab…</span></div>
      </div>
      <button id="theme" class="icon-btn glass" type="button"></button>
      <button id="settings" class="icon-btn glass" type="button" title="All settings" aria-label="All settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
      </button>
    </header>

    <section class="panel glass" aria-labelledby="quick-title">
      <h1 id="quick-title" class="panel__title">Quick toggles <span id="count" class="count"></span></h1>
      <ul id="toggles" class="toggles"></ul>
    </section>

    <div class="actions">
      <button id="unfollowers" class="pill-btn" type="button">Unfollowers checker</button>
      <button id="unsent" class="pill-btn" type="button">Unsent messages</button>
      <button id="open-settings" class="pill-btn pill-btn--accent" type="button">All settings</button>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
