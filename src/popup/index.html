<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <title>Glassgram</title>
    <link rel="stylesheet" href="../shared/glass.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="field" aria-hidden="true">
      <span class="field__pool field__pool--a"></span>
      <span class="field__pool field__pool--b"></span>
      <span class="field__pool field__pool--c"></span>
    </div>

    <header class="head">
      <img class="brand__mark" src="/icons/icon.svg" width="32" height="32" alt="" aria-hidden="true" />
      <div class="head__name">Glassgram</div>
      <div id="status" class="status glass"><span class="status__dot" aria-hidden="true"></span><span id="status-text">Checking…</span></div>
    </header>

    <section id="update" class="update glass" aria-labelledby="update-title" hidden>
      <div class="update__head">
        <span class="update__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
        </span>
        <div class="update__text">
          <h2 id="update-title" class="update__title"></h2>
          <p id="update-sub" class="update__sub"></p>
        </div>
      </div>
      <details class="update__notes">
        <summary>What's new</summary>
        <div id="update-notes"></div>
      </details>
      <div class="update__actions">
        <button id="update-get" class="pill-btn pill-btn--accent" type="button">How to update</button>
        <button id="update-skip" class="pill-btn pill-btn--quiet" type="button">Skip this version</button>
      </div>
    </section>

    <p id="focus-today" class="today glass" hidden></p>

    <section class="group" aria-labelledby="everyday-title">
      <h1 id="everyday-title" class="group__title">Everyday <span id="count" class="count"></span></h1>
      <div id="tiles" class="tiles"></div>
    </section>

    <section id="power" class="group" aria-labelledby="power-title" hidden>
      <h2 id="power-title" class="group__title">Privacy</h2>
      <div id="power-tiles" class="tiles tiles--wide"></div>
    </section>

    <nav class="dock glass" aria-label="Tools">
      <button id="unfollowers" class="dock__btn" type="button" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4" /><path d="M2 21a7 7 0 0 1 14 0" /><path d="M17 11l2 2 4-4" /></svg>
        <span>Unfollowers</span>
      </button>
      <button id="unsent" class="dock__btn" type="button" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 18.5 5.6 15A7.5 7.5 0 1 1 9 18.4Z" /></svg>
        <span>Unsent</span>
      </button>
      <button id="theme" class="dock__btn" type="button"></button>
      <button id="settings" class="dock__btn" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
        <span>Settings</span>
      </button>
    </nav>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
