<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Enhanced · Settings</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand">
          <div class="brand__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 15v4h14v-4"/></svg>
          </div>
          <div>
            <div class="brand__name">Instagram Enhanced</div>
            <div class="brand__sub">Settings · changes apply instantly</div>
          </div>
        </div>
        <div class="topbar__actions">
          <input id="search" class="control search" type="search" placeholder="Search settings" aria-label="Search settings" />
          <span id="saved" class="saved" role="status" aria-live="polite"></span>
        </div>
      </div>
    </header>

    <div class="layout">
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <main id="sections" class="sections"></main>
    </div>

    <footer class="footer">
      <div class="footer__inner">
        <button id="export" class="btn" type="button">Export settings</button>
        <button id="import" class="btn" type="button">Import settings</button>
        <input id="import-file" type="file" accept="application/json" hidden />
        <span class="spacer"></span>
        <button id="reset" class="btn btn--danger" type="button">Reset to defaults</button>
      </div>
    </footer>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
